openapi: 3.0.3
info:
  title: WASAText API
  description: |
    Connettiti con i tuoi amici senza sforzo con WASAText! Invia e ricevi
    messaggi, sia individuali che di gruppo, il tutto comodamente dal tuo
    PC. Goditi conversazioni fluide con testo o GIF e rimani in contatto facilmente
    tramite chat private o discussioni di gruppo.

  version: 0.0.1
tags:
  - name: login
    description: operazioni relative al login 
  - name: info user
    description: operazioni relative alle informazioni dell'utente
  - name: conversations
    description: operazioni relative alle conversazioni
  - name: message
    description: operazioni relative al messaggio della conversazione
  - name: group
    description: operazioni relative alla conversazione di gruppo
  - name: conversation
    description: operazioni relative alla singola conversazione 
  - name: comment
    description: operazioni relative al commento del massaggio
  - name: users
    description: operazione relativa all'elenco degli utenti

components:
  schemas:
    # Duplicato da doLogin per evitare di modificare doLogin con una ref
    Login:
      title: login name
      description: accesso
      type: string
      example: maria
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
    UserName:
      title: User name
      description: nome completo utente
      type: string
      example: Maria
      pattern: '^.*?$'
      minLength: 3
      maxLength: 16
    UserPhoto:
      title: User photo
      description: foto profilo utente
      type: string
      format: binary
      minLength: 64
      maxLength: 524288
    User:
      title: User
      description: nome e foto profilo utente
      type: object
      properties:
        login:
          $ref: "#/components/schemas/Login"
        username:
          $ref: "#/components/schemas/UserName"
        userphoto:
          $ref: "#/components/schemas/UserPhoto"
    ComID:
      title: ID
      description: ID dell oggetto Commento
      type: integer
      minimum: 0
      example: 1
    Contents:
      title: Contents
      description: contenuto del messaggio, testo o immagine
      type: object
      properties:
        category:
          description: tipo di messaggio
          type: string
          enum:
            - text
            - image
            - mixed
        attach:
          description: contenuto del messaggio
          type: string
          pattern: '.*'
          minLength: 1
          maxLength: 524288
          oneOf:
            - format: binary
            - format: text
    Received:
      title: Received
      description: messaggio ricevuto per un utente specifico
      type: object
      properties:
        login:
          $ref: "#/components/schemas/Login"
        username:
          $ref: "#/components/schemas/UserName"
        received:
          description: vero se il messaggio è stato ricevuto da un utente specifico
          type: string
          enum:
            - "true"
            - "false"
    Read:
      title: Read
      description: messaggio letto da un utente specifico
      type: object
      properties:
        login:
          $ref: "#/components/schemas/Login"
        username:
          $ref: "#/components/schemas/UserName"
        read:
          description: vero se il messaggio è stato letto da un utente specifico
          type: string
          enum:
            - "true"
            - "false"
    MesID:
      title: ID
      description: ID dell'oggetto Messaggio
      type: integer
      minimum: 0
      example: 1
    Message:
      title: Message
      description: Questo oggetto rappresenta un singolo messaggio, testo o GIF
      type: object
      properties:
        mesid:
          $ref: "#/components/schemas/MesID"
        conid:
          $ref: "#/components/schemas/ConID"
        timestamp:
          description: timestamp come stringa
          type: string
          format: date-time
          minLength: 14
          maxLength: 35
        contents:
          $ref: "#/components/schemas/Contents"
        isForwarded:
          description: il messaggio viene inoltrato se il valore > 0
          type: integer
          minimum: 0
        username:
          $ref: "#/components/schemas/UserName"
        login:
          $ref: "#/components/schemas/Login"
        receivedarray:
          description: segno di spunta per il messaggio ricevuto
          type: array
          minItems: 0
          maxItems: 32
          items: 
            $ref: "#/components/schemas/Received"
        readarray:
          description: segno di spunta per il messaggio letto
          type: array
          minItems: 0
          maxItems: 32
          items:
            $ref: "#/components/schemas/Read"
        comment:
          description: elenco dei commenti
          minItems: 0
          maxItems: 32
          items:
            $ref: "#/components/schemas/ComID"
    ConID:
      title: ID
      description: ID dell'oggetto Conversazione
      type: integer
      minimum: 0
      example: 1
    ConShort:
      title: Preview
      description: Anteprima della conversazione con l'ultimo messaggio della conversazione
      type: object
      properties:
        conid:
          $ref: "#/components/schemas/ConID"
        categoryinfo:
          description: definire se si tratta di una conversazione normale o di un gruppo
          type: string
          enum:
            - conversation
            - group
        name:
          description: nome del gruppo
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 32
        photo:
          description: foto del profilo o foto di gruppo
          type: string
          format: binary
          minLength: 64
          maxLength: 524288
        sender:
          description: nome del mittente del messaggio
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 32
        toread:
          description: nome del gruppo
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 32
        message:
          $ref: "#/components/schemas/Message"
    ConversationInfo:
      title: Conversation
      description: Questo oggetto rappresenta informazioni su una singola conversazione o gruppo
      type: object
      properties:
        conid:
          $ref: "#/components/schemas/ConID"
        categoryinfo:
          description: definisce se si tratta di una conversazione normale o di un gruppo
          type: string
          enum:
            - conversation
            - group
        name:
          description: nome del gruppo
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 32
        photo:
          description: foto del profilo o foto di gruppo
          type: string
          format: binary
          minLength: 64
          maxLength: 524288
        users:
          description: utente nella conversazione o nel gruppo
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/User"
        # messaggi
    Conversation:
      title: Conversation
      description: Questo oggetto rappresenta una singola conversazione o gruppo con tutti i messaggi
      type: object
      properties:
        conid:
          $ref: "#/components/schemas/ConID"
        categoryinfo:
          description: definisce se si tratta di una conversazione normale o di un gruppo
          type: string
          enum:
            - conversation
            - group
        name:
          description: nome del gruppo
          type: string
          pattern: "^.*?$"
          minLength: 1
          maxLength: 32
        photo:
          description: foto del profilo o foto di gruppo
          type: string
          format: binary
          minLength: 64
          maxLength: 524288
        users:
          description: utente nella conversazione o nel gruppo
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/UserName"
        messages:
          description: elenco dei messaggi nella conversazione
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/Message"
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      bearerFormat: doLogin
  responses:
    UnauthorizedError:
      description: Il token di accesso è mancante o non valido
  parameters:
    UserGroup:
      schema:
        type: boolean
        default: false
      name: showgroups
      in: query
      description: mostra l'elenco dei gruppi di utenti autenticati
      required: false
    Start:
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 5
      name: start
      in: query
      required: false
      description: elenco di elementi nell'array di risposta, utilizzato per la paginazione
    Limit:
      schema:
        type: integer
        minimum: 50
        maximum: 100
        default: 50
        example: 55
      name: limit
      in: query
      required: false
      description: limite del numero di elementi restituiti, utilizzato per la paginazione
    ConversationID:
      schema:
        type: integer
        minimum: 0
        example: 1
        readOnly: true
      name: convid
      in: path
      required: true
      description: ID conversazione
    MessageID:
      schema:
        type: integer
        minimum: 0
        example: 1
        readOnly: true
      name: mesid
      in: path
      required: true
      description: ID messaggio
    Search:
      schema:
        type: string
        pattern: '.*'
        minLength: 0
        maxLength: 16
      name: search
      in: query
      required: false
      description: frammento di nome utente o login da cercare
paths:
  /session:
    post:
      tags: ["login"]
      summary: Accedi all'utente
      description: |-
        Se l'utente non esiste, verrà creato e verrà restituito un identificativo. Se l'utente esiste, verrà restituito l'identificativo utente.
      operationId: doLogin
      requestBody:
        description: Dettagli utente
        content:
          application/json:
            schema:
              description: nome di accesso
              type: object
              properties:
                name:
                  description: nome dell'utente, deve contenere almeno una lettera
                  type: string
                  example: Maria
                  pattern: '^.*[A-Za-z].*$'
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        '201':
          description: Azione di accesso utente riuscita
          content:
            application/json:
              schema:
                description: identificativo utente
                type: object
                properties:
                  identifier:
                    description: la stringa che identifica in modo univoco l'utente
                    type: string
                    example: "abcdef012345abcdef0123451234567a"
                    pattern: '[A-Fa-f0-9]+'
                    minLength: 32
                    maxLength: 32
        '400':
          description: Richiesta non valida, accesso non riuscito o parametri non validi
  /users:
    get:
      tags: ["users"]
      security:
        - Authorization: []
      summary: cerca tra tutti gli utenti
      description: |
        Ottieni l'elenco di tutti gli utenti. Se fornito, il nome utente o il nome di accesso deve corrispondere al frammento specificato nel parametro di ricerca.
      operationId: getUsers
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/UserGroup"
      responses:
        "200":
          description: elenco degli utenti che corrispondono alla ricerca
          content:
            application/json:
              schema:
                description: elenco degli oggetti Utente
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: "#/components/schemas/User"
        '204':
          description: la ricerca non ha prodotto righe
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /info:
    get:
      tags: ["info user"]
      security:
        - Authorization: []
      summary:  informazioni utente
      description: ottiene tutte le informazioni sull'utente
      operationId: getUserInfo
      responses:
        "200":
          description: informazioni utente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '400':
          description: Brutta richiesta
  /info/username:
    put:
      tags: ["info user"]
      security:
        - Authorization: []
      summary: username
      description: |
        Imposta il tuo nome utente o modificalo
      operationId: setMyUserName
      requestBody:
        description: mio nome utente 
        required: true
        content:
            text/plain:
              schema:
                $ref: '#/components/schemas/UserName'
      responses:
        "204":
          description: nome impostato
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        '400':
          description: Brutta richiesta
        "406":
          description: nome non valido (non accettabile)
  /info/userphoto:
    put:
      tags: ["info user"]
      security:
        - Authorization: []
      summary: foto profilo
      description: |
        Imposta la tua foto del profilo o modificala
      operationId: setMyPhoto
      requestBody:
        description: foto profilo da aggiungere o cambiare 
        required: true
        content:
          image/gif:
            schema:
              $ref: "#/components/schemas/UserPhoto"
      responses:
        "204":
          description: foto impostata
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        '400':
          description: Brutta richiesta
        "406":
          description: immagine non valida (non accettabile)
  /conversations:
    get:
      tags: ["conversations"]
      security:
        - Authorization: []
      summary: elenco di tutte le conversazioni
      description: |
        Ottieni l'elenco di tutte le conversazioni, con nome utente o nome del gruppo,foto del profilo e data e ora dell'ultimo messaggio
      operationId: getMyConversations
      responses:
        "200":
          description: elenco di anteprima di tutte le conversazioni
          content:
            application/json:
              schema:
                description: elenco di oggetti ConShort
                type: array
                minItems: 0
                maxItems: 100
                items:
                  $ref: "#/components/schemas/ConShort"
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: ["conversations", "message"]
      security:
        - Authorization: []
      summary: invia nuovo messaggio
      description: |
        invia un nuovo messaggio in una conversazione o gruppo con un nome utente o un nome di gruppo specificato, se la conversazione con il nome utente non esiste creala
      operationId: sendMessage
      parameters:
        - name: conversation
          in: query
          required: true
          description: ID conversazione o nome utente
          schema:
            oneOf:
              - $ref: "#/components/schemas/ConID"
              - $ref: "#/components/schemas/UserName"
        - name: reply
          in: query
          required: false
          description: ID del messaggio a cui rispondere
          schema:
            $ref: "#/components/schemas/MesID"
      requestBody:
        description: corpo del messaggio
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: contenuto dei dati del modulo
              properties:
                image:
                  description: foto
                  type: string
                  format: binary
                  minLength: 64
                  maxLength: 524288
                text:
                  description: testo del messaggio
                  type: string
                  pattern: '.*'
                  example: 'Ciao a tutti!!'
                  minLength: 1
                  maxLength: 8192
            encoding:
              photo:
                contentType: image/gif
              text:
                contentType: text/plain
      responses:
        "201":
          description: messaggio inviato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        # "302": moved, redirect
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: conversazione o utente non trovato
        "406": 
          description: valori di nome o messaggio non accettabili
  /conversations/group:
    put:
      tags: ["conversations", "group"]
      security:
        - Authorization: []
      summary: aggiungi nuovo utente al gruppo
      description: |
        Seleziona i nomi utente da aggiungere a un gruppo. Se il gruppo non esiste, crealo.
      operationId: addToGroup
      parameters:
        - name: users
          in: query
          required: true
          description: utente da aggiungere al gruppo
          schema:
            type: array
            minItems: 1
            maxItems: 32
            items:
              $ref: "#/components/schemas/UserName"
        - name: groupID
          in: query
          required: false
          description: ID gruppo o non richiesto per un nuovo gruppo
          schema:
            $ref: "#/components/schemas/ConID"
      responses:
        "200":
          description: utenti aggiunti al gruppo
          content:
            application/json:
              schema:
                type: object
                description: ID gruppo
                properties:
                  identifierID:
                    $ref: "#/components/schemas/ConID"
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: utente o gruppo non trovato
        "406":
          description: il numero di utenti nel gruppo supera il numero massimo, non accettabile
  /conversations/byid/{convid}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      tags: ["conversation"]
      security:
        - Authorization: []
      summary: elenco tutti i messaggi in una conversazione
      description: |
        Ottieni l'elenco di tutti i messaggi, con il nome utente del mittente, la marca temporale e i segni di spunta
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/Start"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: elenco dei messaggi dell'oggetto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "406": 
          description: valori di inizio o limite non accettabili
    put:
      tags: ["group"]
      security:
        - Authorization: []
      summary: abbandona gruppo
      description: |
        lasciare un gruppo
      operationId: leaveGroup
      responses:
        "204":
          description: Hai lasciato il gruppo
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: la conversazione non è di gruppo
  /conversations/byid/{convid}/name:
    put:
      tags: ["group"]
      security:
        - Authorization: []
      summary: imposta nome gruppo
      description: |
        Imposta il nome del gruppo o modificalo
      operationId: setGroupName
      parameters:
        - $ref: "#/components/parameters/ConversationID"
        - name: name
          in: query
          required: true
          description: nome del gruppo
          schema:
            type: string
            pattern: '.*'
            minLength: 1
            maxLength: 32
      responses:
        "204":
          description: nome impostato
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: la conversazione non è un gruppo
        "406": 
          description: valori dei nomi non accettabili
  /conversations/byid/{convid}/photo:
    put:
      tags: ["group"]
      security:
        - Authorization: []
      summary: imposta foto gruppo
      description: |
        Imposta la foto del gruppo o modificala
      operationId: setGroupPhoto
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      requestBody:
        description: foto di gruppo da aggiungere/modificare
        required: true
        content:
          image/gif:
            schema:
              description: foto del gruppo
              type: string
              format: binary
              minLength: 64
              maxLength: 524288
      responses:
        "204":
          description: foto impostata
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: la conversazione non è un gruppo
        "406": 
          description: valori dei nomi non accettabili
  /conversations/byid/{convid}/info:
    get:
      tags: ["group"]
      security:
        - Authorization: []
      summary: ottieni informazioni inerenti al gruppo
      description: |
        Ottieni la foto e il nome del gruppo
      operationId: getGroupInfo
      parameters:
        - $ref: "#/components/parameters/ConversationID"
      responses:
        "200":
          description: elenco di oggetti Gruppo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationInfo"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: ID conversazione non trovato
        "406":
          description: l'ID della conversazione non è un gruppo
  /conversations/byid/{convid}/message/{mesid}:
    parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
    post:
      tags: ["message"]
      security:
        - Authorization: []
      summary: inoltra messaggio
      description: |
        inoltrare un messaggio a una conversazione o a un gruppo con un nome utente o un nome di gruppo specificato, se la conversazione con il nome utente non esiste, crearla
      operationId: forwardMessage
      requestBody:
        description: conversazione o utente a cui inoltrare
        required: true
        content:
          text/plain:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ConID"
                - $ref: "#/components/schemas/UserName"
      responses:
        "200":
          description: messaggio inoltrato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConID"
        # "302": moved, redirect
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: conversazione o utente non trovato
        "406": 
          description: valori nome utente non accettabili
    delete:
      tags: ["message"]
      security:
        - Authorization: []
      summary: elimina messaggio
      description: |
        eliminare un messaggio in una conversazione
      operationId: deleteMessage
      responses:
        "204":
          description: messaggio eliminato
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: è vietato cancellare i messaggi non posseduti
        "404":
          description: messaggio o ID conversazione non trovato
  /conversations/byid/{convid}/message/{mesid}/comment:
    parameters:
        - $ref: "#/components/parameters/ConversationID"
        - $ref: "#/components/parameters/MessageID"
    post:
      tags: ["comment"]
      security:
        - Authorization: []
      summary: commenta messaggio
      description: |
        reagire a un messaggio con emoji
      operationId: commentMessage
      requestBody:
        description: reazione emoji
        required: true
        content:
          text/plain:
            schema:
              description: emoji
              type: string
              minLength: 1
              maxLength: 4
              pattern: '^.*$'
      responses:
        "200":
          description: messaggio commentato
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComID"
        '400':
          description: Brutta richiesta 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: ID messaggio o ID conversazione non trovati
        "406": 
          description: valori emoji non accettabili
    delete:
      tags: ["comment"]
      security:
        - Authorization: []
      summary: rimuovi commento dal messaggio
      description: |
        elimina la reazione dell'utente autenticato (se presente) a un messaggio
      operationId: uncommentMessage
      responses:
        "204":
          description: commento cancellato
        '400':
          description: Brutta richiesta
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: messaggio o ID conversazione non trovato